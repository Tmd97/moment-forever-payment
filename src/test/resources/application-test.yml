spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
